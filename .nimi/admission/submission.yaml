app_id: io.github.nimiplatform.next-ai-draw-io
display_name: Next AI Draw.io
version: 0.4.18
profile: standalone
npm_package_name: next-ai-draw-io
cargo_package_name: next-ai-draw-io-shell
tauri_identifier: ai.nimi.apps.io.github.nimiplatform.next-ai-draw-io
package_author: DayuanJiang and Next AI Draw.io contributors; Nimi adaptation contributors
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: ~/Library/Application Support/Next AI Draw.io — Nimi/
      purpose: macOS Electron display preferences and browser cache; conversations/templates use Nimi managed storage
      expected_size_band: 1–500 MB
    - path_pattern: "%APPDATA%/Next AI Draw.io — Nimi/"
      purpose: Windows Electron display preferences and browser cache; conversations/templates use Nimi managed storage
      expected_size_band: 1–500 MB
    - path_pattern: User-selected export destinations
      purpose: Drawing and template exports saved through system file dialogs
      expected_size_band: Up to 25 MB per drawing export
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: README.md#support
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
