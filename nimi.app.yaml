app_id: io.github.nimiplatform.next-ai-draw-io
display_name: Next AI Draw.io
version: 0.4.18
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: ~/Library/Application Support/Next AI Draw.io — Nimi/
      purpose: macOS Electron display preferences and browser cache; conversations/templates use Nimi managed storage
      expected_size_band: 1–500 MB
    - path_pattern: "%APPDATA%/Next AI Draw.io — Nimi/"
      purpose: Windows Electron display preferences and browser cache; conversations/templates use Nimi managed storage
      expected_size_band: 1–500 MB
    - path_pattern: User-selected export destinations
      purpose: Drawing and template exports saved through system file dialogs
      expected_size_band: Up to 25 MB per drawing export
local_development:
  electron:
    renderer_origin: http://127.0.0.1:6002
    host_source_directory: electron
metadata:
  summary: Create and edit draw.io diagrams with natural language, images and documents, then restore history or export your work.
  icon: resources/icon.png
  readme: docs/nimi-user-guide.md
  release_notes: docs/nimi-release-notes.md
  author: DayuanJiang and Next AI Draw.io contributors; Nimi adaptation contributors
  homepage_url: https://github.com/nimiplatform/next-ai-draw-io
  support_url: https://github.com/nimiplatform/next-ai-draw-io/issues
